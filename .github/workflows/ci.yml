name: CI

on:
  push:
    branches: [main, rebuild]
  pull_request:
  workflow_dispatch:

# Hosted CI can't build or test the watch app: the Connect IQ SDK's license keeps it out of public CI,
# and the unit tests need the simulator's window. That gate is scripts/build-and-test.sh, run by the
# pre-push hook that scripts/setup.sh installs. CI runs every other gate from scripts/check.sh.
jobs:
  lint:
    name: ShellCheck, actionlint, markdownlint, contract, SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pick the faBolus branch to check the contract against (this branch's name, else main)
        id: fbref
        env:
          WANT: ${{ github.head_ref || github.ref_name }}
        run: |
          REPO="https://github.com/faBolus-app/faBolus.git"
          if [ -n "$WANT" ] && git ls-remote --exit-code --heads "$REPO" "$WANT" >/dev/null 2>&1; then
            echo "ref=$WANT" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out faBolus for the v1 contract schema
        uses: actions/checkout@v4
        with:
          repository: faBolus-app/faBolus
          ref: ${{ steps.fbref.outputs.ref }}
          path: _faBolus

      - name: Install actionlint and markdownlint-cli2
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          sudo mv actionlint /usr/local/bin/
          npm install --global markdownlint-cli2@0.24.0

      - run: SCHEMA=_faBolus/schema/command.schema.json ./scripts/check.sh shell actions markdown contract

  report:
    name: Semgrep (report only)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep (faBolus's shared residue rules)
        run: |
          pipx install semgrep
          curl -fsSL -o /tmp/deslop.yml https://raw.githubusercontent.com/faBolus-app/faBolus/main/.semgrep/deslop.yml
          semgrep --config /tmp/deslop.yml --metrics=off .
